<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ihanda Don Odd — Dynamic Odds Engine</title>
<meta name="theme-color" content="#0b1020">
<style>
:root {
  --bg: #0b1020;
  --panel: #121a2d;
  --panel2: #18223a;
  --text: #f4f7fb;
  --muted: #8e9ab2;
  --line: #26324c;
  --green: #32d583;
  --yellow: #f5c451;
  --red: #ff6b6b;
  --blue: #5b8cff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 75px;
  user-select: none;
}

/* Header */
.app-header {
  position: sticky;
  top: 0;
  background: rgba(13, 20, 38, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
}
.brand { font-size: 18px; font-weight: 800; }
.brand span { color: var(--green); }
.badge-3 {
  background: rgba(50, 213, 131, 0.15);
  color: var(--green);
  font-size: 11px;
  font-weight: 800;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid rgba(50, 213, 131, 0.3);
}

/* App Screens */
.screen { display: none; padding: 16px; }
.screen.active { display: block; }

/* Odd Selector Switcher */
.odd-switcher {
  display: flex;
  gap: 8px;
  background: var(--panel2);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 16px;
  border: 1px solid var(--line);
}
.odd-tab {
  flex: 1;
  padding: 10px 0;
  text-align: center;
  font-size: 13px;
  font-weight: 800;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.odd-tab.active {
  background: var(--blue);
  color: #fff;
}

/* Ticket Hero Card */
.ticket-card {
  background: linear-gradient(145deg, var(--panel), var(--panel2));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  margin-bottom: 20px;
}
.ticket-head { display: flex; justify-content: space-between; align-items: baseline; }
.ticket-title { font-size: 14px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
.ticket-total-odd { font-size: 38px; font-weight: 900; color: var(--green); }

.pick-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.pick-info { display: flex; flex-direction: column; }
.pick-match { font-size: 14px; font-weight: 700; }
.pick-market { font-size: 12px; color: var(--muted); margin-top: 2px; }
.pick-odd { font-weight: 800; color: var(--green); font-size: 15px; }

/* Booking & Actions */
.booking-box {
  background: var(--bg);
  border: 1px dashed var(--blue);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 16px 0;
}
.booking-code { font-family: monospace; font-weight: 800; font-size: 16px; color: var(--yellow); letter-spacing: 1px; }

.action-btn {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.btn-primary { background: var(--green); color: #07120c; }
.btn-secondary { background: var(--panel2); color: #fff; border: 1px solid var(--line); margin-top: 8px; }

/* Return Calculator */
.stake-calculator {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-top: 16px;
}
.stake-input-group { display: flex; gap: 10px; margin-top: 8px; }
.stake-input-group input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
}
.payout-text { font-size: 13px; color: var(--muted); margin-top: 8px; }
.payout-val { color: var(--green); font-weight: 800; font-size: 15px; }

/* Bottom Nav */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 65px;
  background: rgba(13, 20, 38, 0.98);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  text-decoration: none;
  width: 33%;
  padding: 8px 0;
}
.tab-item.active { color: var(--green); }
.tab-icon { font-size: 18px; }
</style>
</head>
<body>

  <header class="app-header">
    <div class="brand">Ihanda <span>Don Odd</span></div>
    <div class="badge-3" id="engine-badge">ODD 2 ACTIVE</div>
  </header>

  <main id="screen-ticket" class="screen active">
    
    <!-- Target Ticket Selector -->
    <div class="odd-switcher">
      <button class="odd-tab active" onclick="loadTicket('odd2', this)">Target Odd 2</button>
      <button class="odd-tab" onclick="loadTicket('odd3', this)">Target Odd 3</button>
      <button class="odd-tab" onclick="loadTicket('odd5', this)">Value Odd 5+</button>
    </div>

    <div class="ticket-card">
      <div class="ticket-head">
        <span class="ticket-title" id="ticket-label">Target Slip</span>
        <div class="ticket-total-odd" id="odd-val">2.02</div>
      </div>
      <div style="font-size:12px; color:var(--muted); margin-bottom:12px;" id="ticket-desc">Engine-checked selections • BetPawa Uganda ready</div>

      <div id="picks-list"></div>

      <div class="booking-box">
        <div>
          <div style="font-size:11px; color:var(--muted)">BetPawa Booking Code:</div>
          <div class="booking-code" id="booking-code">PAWA-202X-UG</div>
        </div>
        <button class="action-btn btn-secondary" style="width:auto; padding:8px 12px; margin:0;" onclick="copyCode()">Copy</button>
      </div>

      <a class="action-btn btn-primary" href="https://www.betpawa.ug/" target="_blank" rel="noopener">
        Open BetPawa App
      </a>
    </div>

    <div class="stake-calculator">
      <div style="font-size:13px; font-weight:700;">Potential Return Calculator</div>
      <div class="stake-input-group">
        <input type="number" id="stake-input" value="2000" min="0" oninput="calculatePayout()">
        <span style="align-self:center; font-weight:700; font-size:13px; color:var(--muted);">UGX</span>
      </div>
      <div class="payout-text">Estimated Return: <span class="payout-val" id="payout-val">UGX 4,040</span></div>
    </div>

  </main>

  <nav class="tab-bar">
    <a href="#" class="tab-item active">
      <span class="tab-icon">🎯</span>
      <span>Daily Slip</span>
    </a>
  </nav>

<script>
// Live Match Odds Data Engine
const ticketPresets = {
  odd2: {
    label: "Safe Odd 2 Ticket",
    code: "PAWA-202X-UG",
    badge: "ODD 2 ACTIVE",
    picks: [
      { match: "Liverpool vs Fulham", market: "Liverpool Win", odd: 1.45 },
      { match: "Chelsea vs Hull City", market: "Chelsea Win", odd: 1.39 }
    ]
  },
  odd3: {
    label: "Target Odd 3 Ticket",
    code: "PAWA-301X-UG",
    badge: "ODD 3 ACTIVE",
    picks: [
      { match: "Sunderland vs Arsenal", market: "Arsenal Win", odd: 1.50 },
      { match: "Liverpool vs Fulham", market: "Over 2.5 Goals", odd: 1.45 },
      { match: "Tottenham vs Everton", market: "Tottenham Double Chance (1X)", odd: 1.38 }
    ]
  },
  odd5: {
    label: "Value Odd 5+ Ticket",
    code: "PAWA-512X-UG",
    badge: "ODD 5 ACTIVE",
    picks: [
      { match: "Sunderland vs Arsenal", market: "Arsenal Win & BTTS", odd: 2.20 },
      { match: "Crystal Palace vs Ipswich", market: "Crystal Palace Win", odd: 1.85 },
      { match: "Liverpool vs Fulham", market: "Over 2.5 Goals", odd: 1.45 }
    ]
  }
};

let currentOddsMultiplier = 2.02;

function loadTicket(type, btn) {
  if (btn) {
    document.querySelectorAll('.odd-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
  }

  const data = ticketPresets[type];
  document.getElementById('ticket-label').textContent = data.label;
  document.getElementById('booking-code').textContent = data.code;
  document.getElementById('engine-badge').textContent = data.badge;

  // Calculate dynamic total odd
  currentOddsMultiplier = data.picks.reduce((acc, p) => acc * p.odd, 1);
  document.getElementById('odd-val').textContent = currentOddsMultiplier.toFixed(2);

  // Render Pick Items
  const picksContainer = document.getElementById('picks-list');
  picksContainer.innerHTML = data.picks.map(p => `
    <div class="pick-item">
      <div class="pick-info">
        <span class="pick-match">${p.match}</span>
        <span class="pick-market">${p.market}</span>
      </div>
      <div class="pick-odd">${p.odd.toFixed(2)}</div>
    </div>
  `).join('');

  calculatePayout();
}

function calculatePayout() {
  const stake = Number(document.getElementById('stake-input').value || 0);
  const payout = Math.round(stake * currentOddsMultiplier);
  document.getElementById('payout-val').textContent = 'UGX ' + payout.toLocaleString();
}

function copyCode() {
  const code = document.getElementById('booking-code').textContent;
  navigator.clipboard?.writeText(code).then(() => {
    alert('Booking Code ' + code + ' copied!\nPaste into BetPawa to load selections.');
  });
}

// Initial Loading
loadTicket('odd2');
</script>
</body>
</html>
