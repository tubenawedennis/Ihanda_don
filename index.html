<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Merge — a number puzzle</title>
<meta name="theme-color" content="#1a1625">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1625;
    --board: #241e33;
    --cell: #2f2844;
    --text: #f4f1fa;
    --muted: #8b83a3;
    --accent: #ffb454;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body {
    height: 100%; margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px;
  }

  .top-row {
    width: 100%; max-width: 420px;
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 18px;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board); border-radius: 10px; padding: 6px 12px; text-align: center; min-width: 56px;
  }
  .score-box .label { font-size: 9.5px; color: var(--muted); font-weight: 700; }
  .score-box .val { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }

  .toolbar {
    width: 100%; max-width: 420px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; font-size: 13px; color: var(--muted);
  }
  .toolbar button {
    background: var(--cell); color: var(--text); border: none; border-radius: 8px;
    padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit;
  }

  .board-wrap {
    position: relative; width: 100%; max-width: 420px; aspect-ratio: 1;
    background: var(--board); border-radius: 16px; padding: 10px;
  }
  .grid {
    position: relative; width: 100%; height: 100%;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .cell-bg { background: var(--cell); border-radius: 10px; }

  .tile {
    position: absolute; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-weight: 800; color: #1a1625;
    transition: top 0.12s ease, left 0.12s ease;
  }
  .tile.spawn { animation: pop 0.16s ease; }
  .tile.merged { animation: pulse 0.16s ease; }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }

  .overlay {
    position: absolute; inset: 10px; border-radius: 16px;
    background: rgba(26, 22, 37, 0.9);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay .msg { font-size: 22px; font-weight: 800; }
  .overlay .sub { font-size: 13.5px; color: var(--muted); }
  .overlay button {
    background: var(--accent); color: #1a1625; border: none; border-radius: 10px;
    padding: 10px 20px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit;
  }

  .hint { margin-top: 16px; font-size: 12.5px; color: var(--muted); text-align: center; max-width: 300px; }
</style>
</head>
<body>

  <div class="top-row">
    <h1>Merge</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">Score</div>
        <div class="val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">Best</div>
        <div class="val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <span>Combine matching tiles to reach 2048</span>
    <button onclick="newGame()">New game</button>
  </div>

  <div class="board-wrap">
    <div class="grid" id="grid">
      <!-- 16 static cell backgrounds -->
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
    </div>
    <div class="overlay" id="overlay">
      <div class="msg" id="overlay-msg">Game over</div>
      <div class="sub" id="overlay-sub">No more moves left.</div>
      <button onclick="newGame()">Try again</button>
    </div>
  </div>

  <div class="hint">Swipe on mobile, or use arrow keys / WASD on desktop.</div>

<script>
  const SIZE = 4;
  let board, score, best, gameOver, won, continueAfterWin;

  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlayEl = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const overlaySub = document.getElementById('overlay-sub');

  function loadBest() { return parseInt(localStorage.getItem('merge_best') || '0', 10); }
  function saveBest(v) { localStorage.setItem('merge_best', String(v)); }

  function emptyBoard() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function newGame() {
    board = emptyBoard();
    score = 0;
    gameOver = false;
    won = false;
    continueAfterWin = false;
    overlayEl.classList.remove('show');
    spawnTile();
    spawnTile();
    render([]);
  }

  function spawnTile() {
    const empties = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === 0) empties.push([r, c]);
    if (!empties.length) return null;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r, c];
  }

  // Tile color scale: purple (low) -> coral -> gold (high)
  function tileColor(value) {
    const stops = [
      { v: 2,    c: [124, 112, 214] },
      { v: 4,    c: [149, 108, 214] },
      { v: 8,    c: [186, 104, 200] },
      { v: 16,   c: [214, 104, 176] },
      { v: 32,   c: [232, 108, 140] },
      { v: 64,   c: [240, 122, 104] },
      { v: 128,  c: [246, 150, 90]  },
      { v: 256,  c: [249, 176, 78]  },
      { v: 512,  c: [250, 198, 70]  },
      { v: 1024, c: [252, 214, 90]  },
      { v: 2048, c: [255, 224, 130] }
    ];
    let match = stops[stops.length - 1];
    for (const s of stops) if (value <= s.v) { match = s; break; }
    return `rgb(${match.c[0]}, ${match.c[1]}, ${match.c[2]})`;
  }

  function textColor(value) {
    return value <= 4 ? '#f4f1fa' : '#1a1625';
  }

  function render(spawned, mergedCells) {
    document.querySelectorAll('.tile').forEach(t => t.remove());
    const rect = gridEl.getBoundingClientRect();
    const gap = 10;
    const cellSize = (rect.width - gap * (SIZE - 1)) / SIZE;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = board[r][c];
        if (!v) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        const isSpawn = spawned && spawned[0] === r && spawned[1] === c;
        const isMerged = mergedCells && mergedCells.some(([mr, mc]) => mr === r && mc === c);
        if (isSpawn) tile.classList.add('spawn');
        if (isMerged) tile.classList.add('merged');
        tile.style.width = cellSize + 'px';
        tile.style.height = cellSize + 'px';
        tile.style.left = c * (cellSize + gap) + 'px';
        tile.style.top = r * (cellSize + gap) + 'px';
        tile.style.background = tileColor(v);
        tile.style.color = textColor(v);
        tile.style.fontSize = (v >= 1024 ? cellSize * 0.32 : cellSize * 0.4) + 'px';
        tile.textContent = v;
        gridEl.appendChild(tile);
      }
    }
    scoreEl.textContent = score;
    best = Math.max(best, score);
    bestEl.textContent = best;
    saveBest(best);
  }

  function slideRow(row) {
    const merged = [];
    let vals = row.filter(v => v !== 0);
    for (let i = 0; i < vals.length - 1; i++) {
      if (vals[i] === vals[i + 1]) {
        vals[i] *= 2;
        score += vals[i];
        if (vals[i] === 2048 && !won) { won = true; }
        vals.splice(i + 1, 1);
        merged.push(i);
      }
    }
    while (vals.length < SIZE) vals.push(0);
    return { vals, merged };
  }

  function boardsEqual(a, b) {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (a[r][c] !== b[r][c]) return false;
    return true;
  }

  function cloneBoard(b) { return b.map(row => [...row]); }

  function move(direction) {
    if (gameOver || (won && !continueAfterWin)) return;
    const prevBoard = cloneBoard(board);
    const mergedCells = [];

    function processLine(getLine, setLine) {
      for (let i = 0; i < SIZE; i++) {
        const line = getLine(i);
        const { vals, merged } = slideRow(line);
        setLine(i, vals);
        merged.forEach(idx => mergedCells.push({ line: i, idx }));
      }
    }

    if (direction === 'left') {
      processLine(r => board[r].slice(), (r, vals) => board[r] = vals);
    } else if (direction === 'right') {
      processLine(r => board[r].slice().reverse(), (r, vals) => board[r] = vals.slice().reverse());
    } else if (direction === 'up') {
      processLine(
        c => board.map(row => row[c]),
        (c, vals) => vals.forEach((v, r) => board[r][c] = v)
      );
    } else if (direction === 'down') {
      processLine(
        c => board.map(row => row[c]).reverse(),
        (c, vals) => vals.slice().reverse().forEach((v, r) => board[r][c] = v)
      );
    }

    if (boardsEqual(prevBoard, board)) return;

    const spawned = spawnTile();
    const mergedCoords = mapMergedToCoords(direction, mergedCells);
    render(spawned, mergedCoords);

    if (won && !continueAfterWin) {
      showOverlay('You reached 2048!', 'Keep going for a higher score, or start fresh.', true);
      return;
    }
    if (!hasMoves()) {
      gameOver = true;
      showOverlay('Game over', 'No more moves left.', false);
    }
  }

  function mapMergedToCoords(direction, mergedCells) {
    // Approximate highlight coords for the merge-pulse animation.
    const coords = [];
    for (const { line, idx } of mergedCells) {
      if (direction === 'left') coords.push([line, idx]);
      else if (direction === 'right') coords.push([line, SIZE - 1 - idx]);
      else if (direction === 'up') coords.push([idx, line]);
      else if (direction === 'down') coords.push([SIZE - 1 - idx, line]);
    }
    return coords;
  }

  function hasMoves() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (board[r][c] === 0) return true;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = board[r][c];
        if (c < SIZE - 1 && board[r][c + 1] === v) return true;
        if (r < SIZE - 1 && board[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function showOverlay(msg, sub, isWin) {
    overlayMsg.textContent = msg;
    overlaySub.textContent = sub;
    overlayEl.classList.add('show');
    if (isWin) {
      overlayEl.querySelector('button').textContent = 'Keep playing';
      overlayEl.querySelector('button').onclick = () => {
        continueAfterWin = true;
        overlayEl.classList.remove('show');
      };
    } else {
      overlayEl.querySelector('button').textContent = 'Try again';
      overlayEl.querySelector('button').onclick = newGame;
    }
  }

  // ---------- Input ----------
  document.addEventListener('keydown', e => {
    const map = {
      ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
      a: 'left', d: 'right', w: 'up', s: 'down'
    };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  });

  let touchStartX = 0, touchStartY = 0;
  const boardWrap = document.querySelector('.board-wrap');
  boardWrap.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  boardWrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  window.addEventListener('resize', () => render([]));

  best = loadBest();
  newGame();
</script>

</body>
</html>
